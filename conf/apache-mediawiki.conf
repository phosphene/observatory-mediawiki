# Observatory MediaWiki — Apache config
# Listens on 8080 internally; Varnish/Traefik handles 80/443 externally.
# This allows Apache to run as www-data (non-root).

Listen 8080

<VirtualHost *:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html/w>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # MW short URLs — /wiki/Article_Name → index.php
    Alias /wiki /var/www/html/w/index.php

    # Deny direct access to sensitive files
    <FilesMatch "\.(php|phtml)$">
        <RequireAny>
            Require all granted
        </RequireAny>
    </FilesMatch>

    <Files "LocalSettings.php">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers (Varnish may also set these — harmless duplication)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
