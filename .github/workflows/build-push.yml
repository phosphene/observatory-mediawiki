name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'        # e.g. v1.43.2
  push:
    branches:
      - main            # push :dev tag on main commits
  workflow_dispatch:    # manual trigger
    inputs:
      tag:
        description: 'Image tag to push (e.g. 1.43.2)'
        required: false
        default: 'dev'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/phosphene/observatory-mediawiki

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,suffix=-dev
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MW_VERSION=${{ github.ref_name == 'main' && '1.43.2' || github.ref_name }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/phosphene/observatory-mediawiki:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
