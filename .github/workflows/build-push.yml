name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.43.2 → triggers versioned release
    branches:
      - main              # e.g. main → pushes :main-dev tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (e.g. 1.43.2-hotfix)'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/phosphene/observatory-mediawiki

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # v1.43.2 tag → :1.43.2 and :1.43 and :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # main branch → :main-dev
            type=ref,event=branch,suffix=-dev
            # manual dispatch override
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit layer cache via GHA cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MW_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.43.2' }}
            GIT_SHA=${{ github.sha }}

  security-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: build
    # Only scan on versioned releases, not every main push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'       # don't fail build on findings — report only

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
