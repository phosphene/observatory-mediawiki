name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/phosphene/observatory-mediawiki

jobs:
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check — DockerSettings.php
        run: php -l conf/DockerSettings.php

      - name: JSON lint — composer.local.json
        run: python3 -m json.tool composer.local.json > /dev/null

      - name: Hadolint — Dockerfile
        run: |
          docker run --rm -i \
            -v "$PWD/hadolint.yaml:/hadolint.yaml" \
            hadolint/hadolint hadolint --config /hadolint.yaml - < Dockerfile

      # PATH A (gomplate): validate values.yml against schema
      # Gated — skips gracefully until values.yml is bootstrapped (step A3)
      - name: Schema validation — values.yml (gomplate)
        if: hashFiles('values.yml') != ''
        run: |
          docker run --rm \
            -v "$PWD/values.yml:/build/values.yml:ro" \
            -v "$PWD/values.schema.json:/build/values.schema.json:ro" \
            -w /build \
            weibeld/ajv-cli:5.0.0 \
            ajv --spec draft7 -c ajv-formats \
            -s /build/values.schema.json \
            -d /build/values.yml

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch,suffix=-dev

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MW_VERSION=1.43.8
            GIT_SHA=${{ github.sha }}

      # Post-build symlink assertions (Path B verification)
      # Verify the built image has the expected filesystem layout.
      # Uses the image digest from the build step to reference the exact image.
      - name: Verify symlink — LocalSettings.php
        run: |
          docker run --rm ${{ steps.build.outputs.imageid }} \
            test -L /var/www/mediawiki/w/LocalSettings.php

      - name: Verify baked file — DockerSettings.php
        run: |
          docker run --rm ${{ steps.build.outputs.imageid }} \
            test -f /var/www/mediawiki/w/DockerSettings.php

  security-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
